<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2A4A"/>
      <stop offset="100%" stop-color="#0F3D3E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6D57A"/>
      <stop offset="100%" stop-color="#C9962C"/>
    </linearGradient>
  </defs>

  <!-- الخلفية: مربع بزوايا دائرية بتدرج كحلي/أخضر داكن -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#C9962C" stroke-opacity="0.35" stroke-width="6"/>

  <!-- قاعدة "المكتبة": ثلاثة أعمدة/رفوف متدرجة الارتفاع تحت المشغّل -->
  <g>
    <rect x="128" y="336" width="46" height="96" rx="8" fill="url(#gold)" opacity="0.9"/>
    <rect x="188" y="304" width="46" height="128" rx="8" fill="url(#gold)"/>
    <rect x="248" y="336" width="46" height="96" rx="8" fill="url(#gold)" opacity="0.9"/>
    <rect x="308" y="288" width="46" height="144" rx="8" fill="url(#gold)" opacity="0.75"/>
  </g>

  <!-- موجات صوت متحلّقة خلف مثلث التشغيل -->
  <g fill="none" stroke="#F6D57A" stroke-width="10" stroke-linecap="round" opacity="0.55">
    <path d="M 300 150 A 92 92 0 0 1 300 330"/>
    <path d="M 322 122 A 132 132 0 0 1 322 358"/>
  </g>

  <!-- مثلث التشغيل الرئيسي -->
  <path d="M 178 138 L 178 246 L 268 192 Z" fill="url(#gold)" stroke="#0F3D3E" stroke-width="4" stroke-linejoin="round"/>
</svg>
